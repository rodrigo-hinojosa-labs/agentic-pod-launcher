name: docker-e2e (nightly)

on:
  # 05:00 UTC = 01:00 Santiago (off-peak). Adjust if it collides with
  # other nightly jobs on the runner queue later.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Trial of the red-night notice (040-nightly-red-alert): skip the suite,
    # simulate the outcome below and publish to a SEPARATE trial notice, so the
    # real one is never touched. A manual run with the defaults is a normal run.
    inputs:
      alert_trial:
        description: 'Trial of the red-night notice: skip the suite and simulate trial_outcome'
        type: boolean
        default: false
      trial_outcome:
        description: 'Simulated outcome of the trial (timeout also lowers the job limit to 1 minute)'
        type: choice
        options:
          - red
          - green
          - timeout
        default: red

permissions:
  contents: read

concurrency:
  group: docker-e2e
  # Nightly runs are independent — don't let a manual dispatch cancel
  # the scheduled one (or vice versa).
  cancel-in-progress: false

jobs:
  e2e:
    name: docker e2e suite (DOCKER_E2E=1)
    runs-on: ubuntu-latest
    # 30 minutes for the scheduled run and for a normal manual run (inputs has no
    # such keys then); 1 minute only in the timeout trial, which sleeps on purpose
    # to see how the platform reports a job that hits its limit.
    timeout-minutes: ${{ (inputs.alert_trial && inputs.trial_outcome == 'timeout') && 1 || 30 }}
    # What the notice job needs to know about this run: the step that failed, the
    # suite summary and the failed tests, all computed by the last step (collect).
    outputs:
      failed_step: ${{ steps.collect.outputs.failed_step }}
      summary: ${{ steps.collect.outputs.summary }}
      failed_tests: ${{ steps.collect.outputs.failed_tests }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Install yq v4 (mikefarah)
        id: install_yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install bats-core
        id: install_bats
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.11.0 \
            https://github.com/bats-core/bats-core /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          bats --version

      # No pipe in this step: `docker info | head -10` under pipefail made head
      # close the pipe after 10 lines, docker took SIGPIPE and the step died
      # with 141 before the suite ever started (039-fix-nightly-e2e-sigpipe).
      # first_line captures the whole output and prints line 1 only, and docker
      # is asked for the few fields worth reading in a log instead of being cut
      # with head: it still fails loudly when the daemon is down, and it shows
      # what head never reached (engine version and architecture).
      - name: Verify deps + docker
        id: verify_deps
        run: |
          set -euo pipefail
          first_line() { local v; v=$("$@"); printf '%s\n' "${v%%$'\n'*}"; }
          first_line bash --version
          bats --version
          yq --version
          jq --version
          git --version
          tmux -V
          docker --version
          docker compose version
          docker info --format 'server={{.ServerVersion}} os={{.OperatingSystem}} arch={{.Architecture}} cgroup={{.CgroupVersion}} storage={{.Driver}}'

      # --tap + tee: the log shows every test live and e2e.tap stays for
      # counting (tee reads to EOF, so it cannot close the pipe early). bats
      # exits 0 when every test is skipped or the list is empty (DOCKER_E2E not
      # propagated, no daemon), so the step turns "nothing executed" into a RED
      # run: a green that ran no test is not a green. A non-zero code from bats
      # always wins over that guard.
      - name: Run docker-e2e suite
        id: run_suite
        if: ${{ !inputs.alert_trial }}
        env:
          DOCKER_E2E: '1'
        run: |
          set -euo pipefail
          rc=0
          bats --print-output-on-failure --tap tests/docker-e2e-*.bats | tee e2e.tap || rc=$?
          total=$(grep -c -E '^(ok|not ok) [0-9]+' e2e.tap || true)
          skipped=$(grep -c -E '^ok [0-9]+ .*# skip' e2e.tap || true)
          failed=$(grep -c -E '^not ok [0-9]+' e2e.tap || true)
          executed=$((total - skipped))
          echo "e2e summary: total=$total executed=$executed skipped=$skipped failed=$failed"
          [ "$rc" -eq 0 ] || exit "$rc"
          if [ "$executed" -eq 0 ]; then
            echo "::error::ningun e2e se ejecuto: todos saltados o lista vacia (revisar DOCKER_E2E, el daemon de Docker y la ruta de los tests)"
            exit 1
          fi

      # Trial of the notice (workflow_dispatch with alert_trial): stands in for the
      # suite and ends red, green or by timeout as trial_outcome says, so the notice
      # can be exercised for real in about a minute instead of ~15.
      - name: Simulate the trial outcome
        id: simulate
        if: ${{ inputs.alert_trial }}
        env:
          TRIAL_OUTCOME: ${{ inputs.trial_outcome }}
        run: .github/scripts/nightly-alert.sh simulate "$TRIAL_OUTCOME"

      # Last step, whatever happened before: it reads the steps context and e2e.tap
      # and hands the notice job the step that failed, the suite summary and the
      # failed tests as job outputs (040-nightly-red-alert). The script always exits
      # 0, and continue-on-error covers the one thing it cannot: failing to start
      # (a lost executable bit, say). Either way the notice machinery must not turn
      # a green night red.
      - name: Collect the facts for the nightly notice
        id: collect
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: .github/scripts/nightly-alert.sh collect

  # The red-night notice (040-nightly-red-alert). A job of its own, so the first
  # identifiable failure of a red run stays the suite step, and the only place that
  # holds `issues: write` (contents: read is here only for the checkout of the
  # script). The publishing step cannot change the color of the run.
  alert:
    name: nightly alert
    needs: e2e
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.alert_trial)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Every step of this job is the notice machinery, so none may turn a green night
      # red: the checkout (a transient failure of GitHub) and the publishing step both
      # carry continue-on-error, and the publishing step has its own limit, shorter than
      # the job's, so a hung gh ends as a failed STEP (absorbed) and not as a job that
      # hit its timeout.
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Publish the nightly notice
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TRIAL: ${{ inputs.alert_trial }}
          RUN_RESULT: ${{ needs.e2e.result }}
          FAILED_STEP: ${{ needs.e2e.outputs.failed_step }}
          SUMMARY: ${{ needs.e2e.outputs.summary }}
          FAILED_TESTS: ${{ needs.e2e.outputs.failed_tests }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: rodrigo-hinojosa
        run: .github/scripts/nightly-alert.sh notify
