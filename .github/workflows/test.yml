name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 025-hermetic-ci-suite: 023 measured that the same commit can be
          # green on one bash and red on another (bash 5.2+'s `&`-in-replacement
          # ksh93-compat change) with nothing declaring which version actually
          # ran. Every macOS ships bash 3.2.57 as /bin/bash (Apple froze it at
          # the last GPLv2 release) — the same interpreter the dev-host suite
          # runs under (see CLAUDE.md). We force it below via PATH=/bin:$PATH,
          # so this is the real floor, not a compiled substitute. Uses
          # macos-latest rather than macos-13: the older macos-13 image is being
          # retired and its runners queue indefinitely (measured ~1h twice,
          # never provisioned); macos-latest carries the same /bin/bash 3.2.57.
          # macos-latest is Apple Silicon (arm64) — the yq step below selects
          # the matching binary; /bin/bash is a universal binary, still 3.2.57.
          - os: ubuntu-latest
            name: "bash 5.x (ubuntu-latest)"
          - os: macos-latest
            name: "bash 3.2 (macos-latest)"
    name: bats tests/ — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yq v4 (mikefarah) — Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install yq v4 (mikefarah) — macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # macos-latest is Apple Silicon (arm64); older Intel runners are
          # x86_64. Pick the matching pinned binary so it runs without Rosetta.
          case "$(uname -m)" in
            arm64) yq_arch=arm64 ;;
            x86_64) yq_arch=amd64 ;;
            *) echo "unsupported macOS arch: $(uname -m)" >&2; exit 1 ;;
          esac
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_darwin_${yq_arch}"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install bats-core — Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.11.0 \
            https://github.com/bats-core/bats-core /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
          bats --version

      - name: Install age (for backup-identity encryption tests) — Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          age --version
          age-keygen --help >/dev/null

      - name: Install bats-core, jq, tmux, age — macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew list bats-core &>/dev/null || brew install bats-core
          brew list jq &>/dev/null || brew install jq
          brew list tmux &>/dev/null || brew install tmux
          brew list age &>/dev/null || brew install age
          bats --version
          jq --version
          tmux -V
          age --version

      - name: "Verify deps + pin the bash target (025/023: never run an assumed version)"
        run: |
          set -euo pipefail
          echo "runner.os=${{ runner.os }}"
          bash --version | head -1
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "--- /bin/bash (the interpreter the 3.2 branch below forces) ---"
            /bin/bash --version | head -1
          fi
          bats --version
          yq --version
          jq --version
          git --version
          tmux -V
          age --version

      - name: Run bats suite (bash 5.x)
        if: runner.os == 'Linux'
        run: bats --print-output-on-failure tests/

      - name: Run bats suite (bash 3.2, forced via PATH)
        if: runner.os == 'macOS'
        run: PATH="/bin:$PATH" bats --print-output-on-failure tests/
